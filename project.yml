name: NexusTravel
options:
  bundleIdPrefix: com.nexustravel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
packages:
  TablerIcons:
    url: https://github.com/YazeedAlKhalaf/tabler-icons-swift.git
    revision: 41cfb5218c63420fea0d729a843b1dadd404ae63
targets:
  NexusTravel:
    type: application
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/App/NexusTravel.entitlements
    sources:
      - Sources
    resources:
      - path: Sources/Core/DesignSystem/Resources/Icons
      - path: Sources/Core/DesignSystem/Resources/Images
    dependencies:
      - package: TablerIcons
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Nexus Travel
        UIAppFonts:
          - plus_jakarta_sans_regular.ttf
          - plus_jakarta_sans_medium.ttf
          - plus_jakarta_sans_semibold.ttf
          - plus_jakarta_sans_bold.ttf
          - plus_jakarta_sans_extrabold.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  NexusTravelTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests
    dependencies:
      - target: NexusTravel
  NexusTravelUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - TestsUI
    dependencies:
      - target: NexusTravel
schemes:
  NexusTravel:
    build:
      targets:
        NexusTravel: all
    test:
      targets:
        - NexusTravelTests
  NexusTravelUI:
    build:
      targets:
        NexusTravel: all
    test:
      targets:
        - NexusTravelUITests
