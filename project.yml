name: NexusTravel
configs:
  Debug: debug
  Release: release
  VisualEvidence: debug
options:
  bundleIdPrefix: com.nexustravel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
  configs:
    # Release favors download and install size: optimize for size, strip symbols into the dSYM,
    # drop unreferenced code, and compress asset catalogs for space.
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      LLVM_LTO: YES_THIN
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      STRIP_SWIFT_SYMBOLS: YES
      COPY_PHASE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ASSETCATALOG_COMPILER_OPTIMIZATION: space
packages:
  TablerIcons:
    url: https://github.com/YazeedAlKhalaf/tabler-icons-swift.git
    revision: 41cfb5218c63420fea0d729a843b1dadd404ae63
targets:
  NexusTravel:
    type: application
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/App/NexusTravel.entitlements
      configs:
        VisualEvidence:
          PRODUCT_BUNDLE_IDENTIFIER: com.nexustravel.NexusTravel.VisualEvidence
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NEXUS_VISUAL_EVIDENCE"
    sources:
      - Sources
    resources:
      - path: Sources/Core/DesignSystem/Resources/Icons
      - path: Sources/Core/DesignSystem/Resources/Images
    dependencies:
      - package: TablerIcons
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Nexus Travel
        UIAppFonts:
          - plus_jakarta_sans_regular.ttf
          - plus_jakarta_sans_medium.ttf
          - plus_jakarta_sans_semibold.ttf
          - plus_jakarta_sans_bold.ttf
          - plus_jakarta_sans_extrabold.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  NexusTravelTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests
    dependencies:
      - target: NexusTravel
  NexusTravelUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - TestsUI
    dependencies:
      - target: NexusTravel
schemes:
  NexusTravel:
    build:
      targets:
        NexusTravel: all
    test:
      targets:
        - NexusTravelTests
  NexusTravelUI:
    build:
      targets:
        NexusTravel: all
    test:
      targets:
        - NexusTravelUITests
